name: Delete Old Runs
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows you to run this manually from the UI

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraiano/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30  # Set to 0 to delete everything
          keep_minimum_runs: 0
