name: Monthly History Cleanup
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: 

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required to delete runs
      contents: read
    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This command gets all run IDs and deletes them
          gh run list --limit 999 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {}
